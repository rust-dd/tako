[package]
name = "openapi-utoipa-example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tako-rs = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }


[workspace]

[workspace.dependencies]
anyhow = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tako-rs = { path = "../../tako-rs", features = ["utoipa"] }
tokio = { version = "1", features = ["full"] }
utoipa = { version = "6.0", features = ["macros"] }
