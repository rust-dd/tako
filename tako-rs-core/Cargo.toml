[package]
name = "tako-rs-core"
description = "Internal core implementation crate for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-core"
homepage = "https://github.com/rust-dd/tako"
readme = "../README.md"

[lib]
name = "tako_rs_core"
path = "src/lib.rs"
doctest = false

[dependencies]
ahash = { workspace = true, optional = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-graphql = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true }
brotli = { workspace = true, optional = true }
bytes = { workspace = true }
chrono = { workspace = true, optional = true }
compio = { workspace = true, optional = true }
cookie = { workspace = true }
cron = { workspace = true, optional = true }
cyper-core = { workspace = true, optional = true }
envy = { workspace = true }
flate2 = { workspace = true, optional = true }
futures-util = { workspace = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
linkme = { workspace = true }
matchit = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
multer = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
prometheus = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
scc = { workspace = true }
send_wrapper = { workspace = true, optional = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
simd-json = { workspace = true, optional = true }
smallvec = { workspace = true }
sonic-rs = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
vespera_core = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[target.'cfg(target_os = "freebsd")'.dependencies]
jwt-simple = { workspace = true, features = ["pure-rust"], optional = true, default-features = false }

[target.'cfg(not(target_os = "freebsd"))'.dependencies]
jwt-simple = { workspace = true, optional = true, features = ["default"] }

[features]
async-graphql = ["dep:async-graphql"]
compio = ["dep:compio", "dep:cyper-core", "dep:send_wrapper"]
compio-tls = ["compio", "tls", "dep:rustls"]
compio-ws = ["compio", "compio/io", "compio/ws"]
metrics-prometheus = ["dep:prometheus", "plugins", "signals"]
metrics-opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "plugins", "signals"]
graphiql = ["dep:async-graphql", "async-graphql/graphiql"]
client = ["tls", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "hyper-util/client", "hyper-util/client-legacy", "hyper-util/http1"]
# Use the operating-system trust store (`rustls-native-certs`) instead of, or
# in addition to, the bundled `webpki-roots` snapshot. When both feature gates
# are active the native store is loaded first and `webpki-roots` is appended.
native-certs = ["client", "dep:rustls-native-certs"]
default = []
file-stream = []
http2 = []
jemalloc = []
multipart = ["dep:multer", "dep:uuid"]
plugins = ["dep:brotli", "dep:flate2"]
protobuf = ["dep:prost"]
signals = []
# `simd` is a meta-feature enabling both SIMD JSON backends. Prefer the
# split features below when you only need one backend — they shrink the
# binary by skipping the unused SIMD parser.
simd = ["simd-sonic", "simd-json-impl"]
# Enables the `sonic-rs` backend used by the built-in `Json<T>` extractor's
# SIMD fast path. (Without this, `Json<T>` falls back to `serde_json`.)
simd-sonic = ["dep:sonic-rs"]
# Enables the `simd-json` backend used by the optional `SimdJson<T>` extractor
# re-exported from `tako-extractors`.
simd-json-impl = ["dep:simd-json"]
tls = ["dep:tokio-rustls", "dep:rustls"]
grpc = ["protobuf"]
queue-cron = ["dep:cron", "dep:chrono"]
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn", "dep:rustls"]
webtransport = ["http3"]
ahash = ["dep:ahash"]
tako-tracing = ["dep:tracing-subscriber"]
utoipa = ["dep:utoipa"]
utoipa-yaml = ["utoipa", "utoipa/yaml"]
vespera = ["dep:vespera_core"]
zero-copy-extractors = []
jwt-simple = ["dep:jwt-simple"]
zstd = ["dep:zstd", "plugins"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "router_dispatch"
harness = false

[[bench]]
name = "json_extract"
harness = false

[lints]
workspace = true
