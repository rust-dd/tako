[package]
name = "tako-rs-core"
description = "Internal core implementation crate for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-core"
homepage.workspace = true
readme = "../README.md"

[lib]
name = "tako_rs_core"
path = "src/lib.rs"

[dependencies]
ahash = { workspace = true, optional = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-graphql = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true }
chrono = { workspace = true, optional = true }
compio = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
envy = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
linkme = { workspace = true }
matchit = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
prost = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
scc = { workspace = true }
send_wrapper = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
smallvec = { workspace = true }
sonic-rs = { workspace = true, optional = true }
thread_local = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
vespera_core = { workspace = true, optional = true }

[features]
async-graphql = ["tako-rs/async-graphql", "dep:async-graphql", "dep:sha2"]
compio = ["tako-rs/compio", "dep:compio", "dep:send_wrapper"]
compio-tls = ["tako-rs/compio-tls", "compio", "tls", "dep:rustls"]
metrics-prometheus = ["tako-rs/metrics-prometheus", "plugins", "signals"]
metrics-opentelemetry = ["tako-rs/metrics-opentelemetry", "plugins", "signals"]
graphiql = ["tako-rs/graphiql", "dep:async-graphql", "async-graphql/graphiql"]
default = []
ws = ["tako-rs/ws", "dep:base64", "dep:sha1", "dep:url", "futures-util/sink", "hyper/http1", "hyper/server"]
file-stream = ["tako-rs/file-stream"]
http2 = ["tako-rs/http2", "hyper/http2"]
jemalloc = ["tako-rs/jemalloc"]
multipart = ["tako-rs/multipart"]
plugins = ["tako-rs/plugins"]
protobuf = ["tako-rs/protobuf", "dep:prost"]
signals = ["tako-rs/signals"]
# Both SIMD JSON backends; the split features below skip the unused parser.
simd = ["tako-rs/simd", "simd-sonic", "simd-json-impl"]
# The `sonic-rs` fast path of `Json<T>`, which otherwise uses `serde_json`.
simd-sonic = ["tako-rs/simd-sonic", "dep:sonic-rs"]
simd-json-impl = ["tako-rs/simd-json-impl"]
tls = ["tako-rs/tls", "dep:rustls"]
grpc = ["tako-rs/grpc", "protobuf", "dep:base64"]
queue-cron = ["tako-rs/queue-cron", "dep:cron", "dep:chrono"]
http3 = ["tako-rs/http3", "dep:rustls"]
webtransport = ["tako-rs/webtransport", "http3"]
ahash = ["tako-rs/ahash", "dep:ahash"]
tako-tracing = ["tako-rs/tako-tracing", "dep:tracing-subscriber"]
utoipa = ["tako-rs/utoipa", "dep:utoipa"]
utoipa-yaml = ["tako-rs/utoipa-yaml", "utoipa", "utoipa/yaml"]
vespera = ["tako-rs/vespera", "dep:vespera_core"]
zero-copy-extractors = ["tako-rs/zero-copy-extractors"]
jwt-simple = ["tako-rs/jwt-simple"]
zstd = ["tako-rs/zstd", "plugins"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
criterion = { workspace = true }
hyper-util = { workspace = true }
tako-rs = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[bench]]
name = "router_dispatch"
harness = false

[[bench]]
name = "json_extract"
harness = false

[[bench]]
name = "queue"
harness = false

[[bench]]
name = "grpc_decode"
harness = false
required-features = ["grpc"]

[lints]
workspace = true
