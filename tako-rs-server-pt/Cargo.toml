[package]
name = "tako-rs-server-pt"
description = "Internal thread-per-core server bootstrap for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-server-pt"
homepage.workspace = true
readme = "../README.md"

[lib]
name = "tako_rs_server_pt"
path = "src/lib.rs"

[dependencies]
compio = { workspace = true, optional = true }
core_affinity = { workspace = true, optional = true }
cyper-core = { workspace = true, optional = true }
futures-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true }
send_wrapper = { workspace = true, optional = true }
socket2 = { workspace = true, features = ["all"] }
tako-rs-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[features]
default = ["affinity"]
affinity = ["dep:core_affinity"]
plugins = ["tako-rs/plugins", "tako-rs-core/plugins"]
signals = ["tako-rs/signals", "tako-rs-core/signals"]
compio = ["tako-rs/compio", "dep:compio", "dep:cyper-core", "dep:send_wrapper", "tako-rs-core/compio"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tako-rs = { workspace = true }
