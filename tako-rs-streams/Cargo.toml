[package]
name = "tako-rs-streams"
description = "Internal stream/upgrade transports for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-streams"
homepage = "https://github.com/rust-dd/tako"
readme = "../README.md"

[lib]
name = "tako_rs_streams"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true }
compio = { workspace = true, optional = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
percent-encoding = { workspace = true }
pin-project-lite = { workspace = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
tako-rs-core = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
url = { workspace = true }

[features]
default = []
sse = ["tako-rs/sse"]
ws = ["tako-rs/ws", "dep:tokio-tungstenite", "dep:sha1", "dep:base64", "hyper/http1", "hyper/server", "tako-rs-core/ws"]
file-stream = ["tako-rs/file-stream"]
plugins = ["tako-rs/plugins"]
signals = ["tako-rs/signals", "tako-rs-core/signals"]
compio = ["tako-rs/compio", "dep:compio", "dep:send_wrapper", "tako-rs-core/compio"]
compio-ws = ["tako-rs/compio-ws", "dep:sha1", "dep:base64", "compio", "compio/io", "compio/ws"]
http3 = ["tako-rs/http3", "dep:quinn", "dep:rustls", "tako-rs-core/http3"]
webtransport = ["tako-rs/webtransport", "http3"]

[lints]
workspace = true

[dev-dependencies]
tako-rs = { workspace = true }
