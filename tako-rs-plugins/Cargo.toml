[package]
name = "tako-rs-plugins"
description = "Internal plugin and concrete-middleware implementations for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-plugins"
homepage.workspace = true
readme = "../README.md"
keywords = ["web", "framework", "middleware", "plugin", "http"]
categories = ["web-programming", "web-programming::http-server", "asynchronous"]

[lib]
name = "tako_rs_plugins"
path = "src/lib.rs"

[dependencies]
ahash = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
brotli = { workspace = true, optional = true }
bytes = { workspace = true }
compio = { workspace = true, optional = true }
cookie = { workspace = true }
flate2 = { workspace = true, optional = true }
futures-util = { workspace = true }
hmac = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }
ipnet = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
mime = { workspace = true }
multer = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
prometheus = { workspace = true, optional = true }
scc = { workspace = true }
send_wrapper = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
subtle = { workspace = true }
tako-rs-core = { workspace = true }
tako-rs-extractors = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true, optional = true }

[target.'cfg(target_os = "freebsd")'.dependencies]
jwt-simple = { workspace = true, features = ["pure-rust"], optional = true, default-features = false }

[target.'cfg(not(target_os = "freebsd"))'.dependencies]
jwt-simple = { workspace = true, optional = true, features = ["default"] }

[features]
default = []
plugins = ["tako-rs/plugins", "dep:brotli", "dep:flate2", "tako-rs-core/plugins"]
multipart = ["tako-rs/multipart", "dep:multer", "tako-rs-extractors/multipart"]
metrics-prometheus = ["tako-rs/metrics-prometheus", "dep:prometheus", "plugins", "signals"]
metrics-opentelemetry = ["tako-rs/metrics-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "plugins", "signals"]
signals = ["tako-rs/signals", "tako-rs-core/signals"]
ahash = ["tako-rs/ahash", "dep:ahash", "tako-rs-core/ahash"]
jwt-simple = ["tako-rs/jwt-simple", "dep:jwt-simple"]
zstd = ["tako-rs/zstd", "dep:zstd", "plugins"]
# CIDR-aware IP filter middleware.
ip-filter = ["tako-rs/ip-filter", "dep:ipnet"]
# HMAC signature verifier (Stripe / AWS-style request signing).
hmac-signature = ["tako-rs/hmac-signature", "dep:hmac"]
# JSON-schema body validator middleware.
json-schema = ["tako-rs/json-schema", "dep:jsonschema"]
# compio is forwarded for cfg gating inside concrete plugin/middleware impls.
compio = ["tako-rs/compio", "dep:compio", "dep:send_wrapper", "tako-rs-core/compio"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
tako-rs = { workspace = true }

[[bench]]
name = "compression"
harness = false
required-features = ["plugins"]

[[bench]]
name = "rate_limiter"
harness = false
required-features = ["plugins"]
