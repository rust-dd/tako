[package]
name = "tako-rs-server"
description = "Internal server bootstrap for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-server"
homepage.workspace = true
readme = "../README.md"

[lib]
name = "tako_rs_server"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
compio = { workspace = true, optional = true }
crc32c = { workspace = true, optional = true }
cyper-core = { workspace = true, optional = true }
futures-util = { workspace = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true }
listenfd = { workspace = true, optional = true }
pin-project-lite = { workspace = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }
tako-rs-core = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tokio-vsock = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = []
proxy-protocol = ["tako-rs/proxy-protocol", "dep:crc32c"]
udp = ["tako-rs/udp"]
signals = ["tako-rs/signals", "tako-rs-core/signals"]
tls = ["tako-rs/tls", "dep:tokio-rustls", "dep:rustls", "tako-rs-core/tls"]
http2 = ["tako-rs/http2", "hyper/http2", "hyper-util/http2", "tako-rs-core/http2"]
# http3 requires the same rustls assembly as `tls` (cert resolver, mTLS,
# ReloadableResolver) so it pulls the `tls` feature in to share the helpers.
# On compio it also turns on `compio-quic` with its ring-backed rustls glue.
http3 = ["tako-rs/http3", "tls", "dep:h3", "dep:h3-quinn", "dep:quinn", "tako-rs-core/http3", "compio?/h3", "compio?/ring"]
compio = ["tako-rs/compio", "dep:compio", "dep:cyper-core", "dep:send_wrapper", "tako-rs-core/compio"]
compio-tls = ["tako-rs/compio-tls", "compio", "tls"]
# Forwarded so cfg-gated PROXY-protocol code can compile when plugins is enabled.
# Also activates `tako-core/plugins` so `Router::setup_plugins_once` is available
# in the compio server bootstrap.
plugins = ["tako-rs/plugins", "tako-rs-core/plugins"]
tako-tracing = ["tako-rs/tako-tracing", "tako-rs-core/tako-tracing"]
# Inherit systemd / s6 / catflap inherited file descriptors at startup.
socket-activation = ["tako-rs/socket-activation", "dep:listenfd"]
# Linux vsock transport for VM-host bridges.
vsock = ["tako-rs/vsock", "dep:tokio-vsock"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
hyper = { workspace = true, features = ["client"] }
rcgen = { workspace = true }
tako-rs = { workspace = true }
