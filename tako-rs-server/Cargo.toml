[package]
name = "tako-rs-server"
description = "Internal server bootstrap for tako-rs. Use the `tako-rs` umbrella crate instead."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tako-rs-server"
homepage = "https://github.com/rust-dd/tako"
readme = "../README.md"

[lib]
name = "tako_rs_server"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
compio = { workspace = true, optional = true }
crc32c = { workspace = true }
cyper-core = { workspace = true, optional = true }
futures-util = { workspace = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
listenfd = { workspace = true, optional = true }
pin-project-lite = { workspace = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }
tako-rs-core = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tokio-vsock = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = []
signals = ["tako-rs-core/signals"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile", "tako-rs-core/tls"]
# `http2` is a *gate flag* — it toggles HTTP/2 code paths inside tako-server
# but does NOT disable hyper's `http2` feature, because the workspace pulls
# hyper with `features = ["full"]`. Turning this flag off makes Tako skip
# the H2 server builder, but hyper itself still ships H2 in the binary.
# (Removing it from hyper would require a feature-conditional dependency
# alias across the workspace — tracked for 2.x.)
http2 = []
# http3 requires the same rustls assembly as `tls` (cert resolver, mTLS,
# ReloadableResolver) so it pulls the `tls` feature in to share the helpers.
http3 = ["tls", "dep:h3", "dep:h3-quinn", "dep:quinn", "tako-rs-core/http3"]
compio = ["dep:compio", "dep:cyper-core", "dep:send_wrapper", "tako-rs-core/compio"]
compio-tls = ["compio", "tls"]
# Forwarded so cfg-gated PROXY-protocol code can compile when plugins is enabled.
# Also activates `tako-core/plugins` so `Router::setup_plugins_once` is available
# in the compio server bootstrap.
plugins = ["tako-rs-core/plugins"]
tako-tracing = ["tako-rs-core/tako-tracing"]
# Inherit systemd / s6 / catflap inherited file descriptors at startup.
socket-activation = ["dep:listenfd"]
# Linux vsock transport for VM-host bridges.
vsock = ["dep:tokio-vsock"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
